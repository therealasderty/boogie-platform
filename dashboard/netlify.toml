[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "../netlify/functions"

[functions."pulizia-chiusure"]
  schedule = "0 3 * * 1"

[functions."statistiche-settimanali"]
  schedule = "0 23 * * 0"

[functions."pubblica-social-schedulato"]
  schedule = "0 * * * *"

[functions.invia-campagna-mail]
  schedule = "0 8 * * *"
  timeout = 26