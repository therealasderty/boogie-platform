[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "../netlify/functions"

[functions."pulizia-chiusure"]
  schedule = "0 3 * * 1"

[functions."statistiche-settimanali"]
  schedule = "0 23 * * 0"

[functions."pubblica-social-schedulato"]
  schedule = "0 * * * *"

[functions.invia-campagna-mail]
  timeout = 26

# No schedule qui: il cron campagne è solo sul sito website (root netlify.toml)
# per evitare doppi invii. L'invio manuale dashboard usa gestisci → stesso codice shared.
[functions.cron-invia-campagna-mail]
  timeout = 26

[functions.cron-invia-campagna-mail-background]
  timeout = 900
